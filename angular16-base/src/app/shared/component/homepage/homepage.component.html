<div class="container py-4">
  <div class="row justify-content-center">
    <!-- Welcome Section -->
    <div class="col-12 text-center mb-5">
      <h2 class="welcome-text mb-2">Benvenuto!</h2>
      <p class="text-muted">Pronto per la prossima sfida?</p>
    </div>

    <!-- Quick Action Dashboard -->
    <div class="col-12 col-md-10 col-lg-8">
      <div class="row g-4 justify-content-center">
        <div class="col-6 col-sm-5 col-md-4" routerLink="/prenotazioni">
          <div class="action-card shadow-sm">
            <i class="fa fa-calendar action-icon text-success"></i>
            <span>Prenota</span>
          </div>
        </div>
        <div class="col-6 col-sm-5 col-md-4" routerLink="/partite">
          <div class="action-card shadow-sm">
            <i class="fa fa-futbol-o action-icon text-success"></i>
            <span>Partite</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Recent Match Card -->
    <div class="col-12 col-md-10 col-lg-8 mt-5" (click)="openMatchDetails()" style="cursor: pointer;">
      <div class="match-card shadow-sm">
        <h3 class="match-title">Ultima Partita</h3>
        <div class="match-content">
          <div class="team-container">
            <div class="team-logo shadow-sm">
              <i class="fa fa-shield" style="font-size: 1.8rem; color: #ff4444;"></i>
            </div>
            <span class="team-name text-truncate w-100">{{ selectedMatch().homeTeam }}</span>
          </div>
          <div class="score-container">
            <span class="score-text">{{ selectedMatch().homeScore }} - {{ selectedMatch().awayScore }}</span>
            <span class="match-status text-success">{{ selectedMatch().status }}</span>
          </div>
          <div class="team-container">
            <div class="team-logo shadow-sm">
              <i class="fa fa-star" style="font-size: 1.8rem; color: #ffcc00;"></i>
            </div>
            <span class="team-name text-truncate w-100">{{ selectedMatch().awayTeam }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
