@if (isVisible) {
  <!-- Backdrop with blur -->
  <div class="modal-backdrop" (click)="onCancel()"></div>

  <!-- Modal Container -->
  <div class="modal-container shadow-lg">
    <!-- Header -->
    <header class="modal-header">
      <button nz-button type="button" nzType="text" class="back-button" (click)="onCancel()">
        <span nz-icon nzType="arrow-left" nzTheme="outline"></span>
      </button>
      <h2 class="modal-title m-0">Modifica Password</h2>
    </header>

    <!-- Main Content Area -->
    <main class="modal-content-area">
      <form class="password-form" (submit)="$event.preventDefault(); onConfirm()">
        <p class="text-muted small mb-4">Inserisci e conferma la nuova password per il tuo account.</p>

        <div class="mb-3">
          <label class="form-label">Nuova Password</label>
          <input 
            type="password" 
            [(ngModel)]="nuovaPassword" 
            name="nuovaPassword"
            class="custom-input" 
            placeholder="Almeno 6 caratteri"
            (keyup.enter)="onConfirm()" />
        </div>

        <div class="mb-3">
          <label class="form-label">Conferma Password</label>
          <input 
            type="password" 
            [(ngModel)]="confermaPassword" 
            name="confermaPassword"
            class="custom-input" 
            placeholder="Ripeti la password"
            (keyup.enter)="onConfirm()" />
        </div>

        @if (errorMessage) {
          <div class="text-danger small mt-2 fw-semibold text-center">{{ errorMessage }}</div>
        }
      </form>
    </main>

    <!-- Footer -->
    <footer class="modal-footer">
      <button nz-button type="button" nzType="default" (click)="onCancel()" class="footer-btn cancel-btn">
        Annulla
      </button>
      <button nz-button type="button" nzType="primary" (click)="onConfirm()" class="footer-btn save-btn">
        Salva
      </button>
    </footer>
  </div>
}
