<section class="overlay-content">
  <main class="overlay-content__body">
    <form (ngSubmit)="save()">
      <p class="intro">Inserisci e conferma la nuova password per il tuo account.</p>

      <div class="field">
        <label for="new-password">Nuova password</label>
        <input
          id="new-password"
          type="password"
          [(ngModel)]="nuovaPassword"
          name="nuovaPassword"
          placeholder="Almeno 6 caratteri"
          autocomplete="new-password" />
      </div>

      <div class="field">
        <label for="confirm-password">Conferma password</label>
        <input
          id="confirm-password"
          type="password"
          [(ngModel)]="confermaPassword"
          name="confermaPassword"
          placeholder="Ripeti la password"
          autocomplete="new-password" />
      </div>

      @if (errorMessage()) {
        <p class="error-message" role="alert">{{ errorMessage() }}</p>
      }
    </form>
  </main>

  <footer class="overlay-content__actions">
    <button nz-button type="button" [disabled]="saving()" (click)="cancel()">Annulla</button>
    <button nz-button type="button" nzType="primary" [nzLoading]="saving()" (click)="save()">Salva</button>
  </footer>
</section>
