<div class="main-layout-container">
  <!-- Desktop Sidebar -->
  <aside class="desktop-sidebar d-none d-lg-flex">
    <div class="sidebar-header">
      <h1 class="navbar-brand">Friday League</h1>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item-desktop" routerLink="/" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="active">
        <i class="fa fa-home"></i>
        <span>Home</span>
      </div>
      <div class="nav-item-desktop" routerLink="/prenotazioni" routerLinkActive="active">
        <i class="fa fa-calendar"></i>
        <span>Prenota</span>
      </div>
      <div class="nav-item-desktop" routerLink="/calendario" routerLinkActive="active">
        <i class="fa fa-futbol-o"></i>
        <span>Calendario</span>
      </div>
      <div class="nav-item-desktop" routerLink="/profilo" routerLinkActive="active">
        <i class="fa fa-user"></i>
        <span>Profilo</span>
      </div>
      <div class="nav-item-desktop" routerLink="/classifiche" routerLinkActive="active">
        <i class="fa fa-trophy"></i>
        <span>Classifiche</span>
      </div>
      <!-- Theme Toggle (Desktop) -->
      <div class="nav-item-desktop mt-4" (click)="toggleTheme()">
        <span nz-icon [nzType]="currentTheme() === 'dark' ? 'sun' : 'moon'" nzTheme="outline"></span>
        <span>{{ currentTheme() === 'dark' ? 'Light Mode' : 'Dark Mode' }}</span>
      </div>
      <!-- Login (Desktop) -->
      <div class="nav-item-desktop logout-item-desktop mt-4" routerLink="/login">
        <span nz-icon nzType="logout" nzTheme="outline"></span>
        <span>Esci</span>
      </div>
    </nav>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="content-wrapper">
    <!-- Top Navbar (Mobile/Tablet) -->
    <header class="top-navbar d-lg-none shadow-sm">
      <div class="container-fluid d-flex justify-content-between align-items-center h-100 px-4">
        <!-- Logout (Mobile) -->
        <div class="logout-mobile" routerLink="/login"
          style="cursor: pointer; font-size: 1.5rem; color: var(--text-primary); display: flex; align-items: center;">
          <span nz-icon nzType="logout" nzTheme="outline"></span>
        </div>
        <h1 class="navbar-brand m-0">Friday League</h1>
        <!-- Theme Toggle (Mobile) -->
        <div class="theme-toggle-mobile" (click)="toggleTheme()"
          style="cursor: pointer; font-size: 1.5rem; color: var(--text-primary); display: flex; align-items: center;">
          <span nz-icon [nzType]="currentTheme() === 'dark' ? 'sun' : 'moon'" nzTheme="outline"></span>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>

    <!-- Bottom Navbar (Mobile/Tablet) -->
    <nav class="bottom-navbar d-lg-none shadow">
      <div class="nav-item" routerLink="/" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="active">
        <i class="fa fa-home"></i>
        <span>Home</span>
      </div>
      <div class="nav-item" routerLink="/prenotazioni" routerLinkActive="active">
        <i class="fa fa-calendar"></i>
        <span>Prenota</span>
      </div>
      <div class="nav-item" routerLink="/calendario" routerLinkActive="active">
        <i class="fa fa-futbol-o"></i>
        <span>Calendario</span>
      </div>
      <div class="nav-item" routerLink="/profilo" routerLinkActive="active">
        <i class="fa fa-user"></i>
        <span>Profilo</span>
      </div>
      <div class="nav-item" routerLink="/classifiche" routerLinkActive="active">
        <i class="fa fa-trophy"></i>
        <span>Classifiche</span>
      </div>
    </nav>
  </div>
</div>
