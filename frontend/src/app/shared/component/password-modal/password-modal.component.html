@if (isVisible) {
  <div class="confirm-modal-overlay" (click)="onCancel()">
    <div class="confirm-modal-card animate-zoom" (click)="$event.stopPropagation()">
      <!-- Icona in cima -->
      <div class="confirm-modal-icon-container">
        <span nz-icon nzType="lock" nzTheme="outline" class="modal-icon"></span>
      </div>
      
      <!-- Titolo -->
      <h3 class="confirm-modal-title">Modifica Password</h3>
      <p class="confirm-modal-message">Inserisci la nuova password per il tuo account.</p>
      
      <!-- Campi di input -->
      <div class="password-form-fields w-100 mb-4 text-start">
        <div class="mb-3">
          <label class="form-label text-secondary small fw-bold text-uppercase">Nuova Password</label>
          <input 
            type="password" 
            [(ngModel)]="nuovaPassword" 
            class="form-control custom-input" 
            placeholder="Almeno 6 caratteri"
            (keyup.enter)="onConfirm()">
        </div>
        <div>
          <label class="form-label text-secondary small fw-bold text-uppercase">Conferma Password</label>
          <input 
            type="password" 
            [(ngModel)]="confermaPassword" 
            class="form-control custom-input" 
            placeholder="Ripeti la password"
            (keyup.enter)="onConfirm()">
        </div>
        
        @if (errorMessage) {
          <div class="text-danger small mt-2 text-center">{{ errorMessage }}</div>
        }
      </div>
      
      <!-- Pulsanti d'azione -->
      <div class="confirm-modal-footer w-100">
        <button class="modal-btn cancel-btn" (click)="onCancel()">
          Annulla
        </button>
        <button class="modal-btn confirm-btn" (click)="onConfirm()">
          Salva
        </button>
      </div>
    </div>
  </div>
}
