<div class="impostazioni-container">
  <div class="header-section mb-4">
    <h2 class="title text-primary">Impostazioni Lega</h2>
    <p class="subtitle text-secondary">
      Gestisci le impostazioni, i partecipanti e le configurazioni per la lega attiva.
    </p>
  </div>

  <div class="row g-4">
    <!-- Card Gestione Partecipanti -->
    <div class="col-md-6 col-lg-4">
      <div class="settings-card shadow-sm" [routerLink]="['partecipanti']">
        <div class="icon-container">
          <span nz-icon nzType="team" nzTheme="outline" class="settings-icon"></span>
        </div>
        <div class="card-details">
          <h4 class="card-title">Gestisci Partecipanti</h4>
          <p class="card-description">Visualizza l'elenco degli iscritti, gestisci i loro ruoli e controlla chi partecipa alla lega.</p>
        </div>
        <div class="arrow-container">
          <span nz-icon nzType="arrow-right" nzTheme="outline" class="arrow-icon"></span>
        </div>
      </div>
    </div>
  </div>
</div>
