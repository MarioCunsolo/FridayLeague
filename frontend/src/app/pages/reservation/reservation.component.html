<div class="container py-4">
  <div class="row justify-content-center h-100">
    <div class="col-12 col-md-10 col-lg-9 d-flex flex-column h-100">
      <!-- Section Header -->
      <div class="d-flex align-items-center mb-4">
        <h2 class="section-title m-0">Prenotazioni</h2>
      </div>

      <div class="reservation-card shadow-sm d-flex flex-column flex-grow-1">
        <p class="text-muted small mb-3 text-uppercase fw-bold">PROSSIMA SETTIMANA</p>

        <div class="table-responsive flex-grow-1 mb-3">
          <table class="table custom-table mb-0">
            <thead>
              <tr>
                <th>GIOCATORE</th>
                <th>ORARIO</th>
                <th class="text-center">AZIONI</th>
              </tr>
            </thead>
            <tbody class="scrollable-tbody">
              @for (res of reservations(); track $index) {
              <tr>
                <td class="fw-bold">{{ res.nomeCognome }}</td>
                <td class="text-success">{{ res.dataOra | date:'HH:mm:ss' }}</td>
                <td class="text-center">
                  <button nz-button nzType="text" nzDanger>
                    <i class="fa fa-trash-o"></i>
                  </button>
                </td>
              </tr>
              }
            </tbody>
          </table>
        </div>

        <div class="mt-auto">
          <button nz-button nzType="primary" nzBlock class="btn-prenota shadow" [disabled]="isReservationDisabled()">
            PRENOTATI
          </button>
          <p class="text-center text-muted small mt-2 mb-0">
            Le prenotazioni aprono Domenica alle 17:00
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
